<div class="admin-footer-page">
  <h2>Editar Footer</h2>
  <div class="footer-form">
    <label>Texto de marca:
      <input type="text" [value]="data.brandText" (input)="updateField('brandText', $event.target.value)" />
    </label>
    <label>Descripción:
      <input type="text" [value]="data.description" (input)="updateField('description', $event.target.value)" />
    </label>
    <label>WhatsApp:
      <input type="text" [value]="data.whatsapp" (input)="updateField('whatsapp', $event.target.value)" />
    </label>
    <label>Teléfono:
      <input type="text" [value]="data.phone" (input)="updateField('phone', $event.target.value)" />
    </label>
    <label>Email:
      <input type="text" [value]="data.email" (input)="updateField('email', $event.target.value)" />
    </label>
    <label>Ubicación:
      <input type="text" [value]="data.location" (input)="updateField('location', $event.target.value)" />
    </label>
    <label>Copyright:
      <input type="text" [value]="data.copyright" (input)="updateField('copyright', $event.target.value)" />
    </label>
    <label>Hecho en:
      <input type="text" [value]="data.madeIn" (input)="updateField('madeIn', $event.target.value)" />
    </label>
  </div>
</div>
