<div class="admin-gallery-page">
	<h2>Galería de Imágenes</h2>

	@if (loading()) {
	<p class="loading-text">Cargando galería...</p>
	}

	<div class="gallery-actions">
		<input type="file" accept="image/*" multiple (change)="onFileChange($event)" />
		<button class="btn btn-primary" [disabled]="uploading()" (click)="uploadImages()">
			{{ uploading() ? 'Subiendo...' : 'Subir imágenes' }}
		</button>
	</div>

	@if (error()) {
	<div class="error">{{ error() }}</div>
	}

	<div class="gallery-list">
		@for (img of images(); track img.filename) {
		<div class="gallery-item">
			<!-- ⚠️ Ajusta la ruta '/assets/img/' si tu backend sirve los archivos estáticos desde otra ruta (ej: '/uploads/') -->
			<img [src]="'/assets/img/' + img.filename" [alt]="img.title" />
			<div class="item-info">
				<span class="img-title">{{ img.title }}</span>
				<button class="btn btn-danger btn-sm" (click)="deleteImage(img.filename)">Eliminar</button>
			</div>
		</div>
		} @empty {
		@if (!loading()) {
		<p class="empty-state">No hay imágenes en la galería aún.</p>
		}
		}
	</div>
</div>
