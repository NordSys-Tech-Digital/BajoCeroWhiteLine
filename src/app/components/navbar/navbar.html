<header [ngClass]="{ 'scrolled': scrolled() }">
	<div class="container nav-inner">

		<a class="logo" routerLink="/">
			<div class="logo-icon">
				<svg viewBox="0 0 32 32" fill="none">
					<path d="M16 4L16 28M4 16L28 16M7.5 7.5L24.5 24.5M24.5 7.5L7.5 24.5" stroke="white"
						stroke-width="2.5" stroke-linecap="round" />
					<circle cx="16" cy="16" r="5" fill="white" opacity="0.9" />
				</svg>
			</div>
			<span class="logo-text">Cryo<strong>Tech</strong></span>
		</a>

		<nav class="nav-links">
			@for (link of navLinks; track link.label) {
			<a [routerLink]="link.routerLink" [fragment]="link.fragment ?? undefined" routerLinkActive="nav-active"
				[routerLinkActiveOptions]="{ exact: link.routerLink === '/' && !link.fragment }"
				(click)="navigate(link)">
				{{ link.label }}
			</a>
			}
		</nav>

		<div class="nav-actions">
			<a routerLink="/admin" class="btn btn-outline admin-link">⚙️ Admin</a>
			<a href="https://wa.me/573001234567" target="_blank" class="btn btn-outline">WhatsApp</a>
			<a href="tel:+576011234567" class="btn btn-primary">Llamar ahora</a>
		</div>

		<button class="hamburger" (click)="toggleMenu()" [ngClass]="{ 'open': menuOpen() }">
			<span></span><span></span><span></span>
		</button>
	</div>

	<!-- Mobile menu -->
	<div class="mobile-menu" [ngClass]="{ 'open': menuOpen() }">
		@for (link of navLinks; track link.label) {
		<a [routerLink]="link.routerLink" [fragment]="link.fragment ?? undefined" (click)="navigate(link)">
			{{ link.label }}
		</a>
		}
		<div class="mobile-actions">
			<a routerLink="/admin" class="btn btn-outline">⚙️ Admin</a>
			<a href="https://wa.me/573001234567" class="btn btn-outline">WhatsApp</a>
			<a href="tel:+576011234567" class="btn btn-primary">Llamar ahora</a>
		</div>
	</div>
</header>
